name: Unix E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  e2e-yoroi-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dali-rp2
        uses: actions/checkout@v4
        with:
          repository: anlach/dali-rp2
          path: dali-rp2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e dali-rp2/

      - name: Run Yoroi E2E tests
        run: |
          export PYTHONPATH=${{ github.workspace }}/dali-rp2/src:$PYTHONPATH
          cd ${{ github.workspace }}/dali-rp2
          pytest tests/e2e/test_yoroi_e2e.py -v --tb=short

  e2e-dali-rp2-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rp2
        uses: actions/checkout@v4
        with:
          repository: anlach/rp2
          path: rp2
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Checkout dali-rp2
        uses: actions/checkout@v4
        with:
          repository: anlach/dali-rp2
          path: dali-rp2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install both packages
          pip install -e dali-rp2/
          pip install -e rp2/

      - name: Run dali-rp2 → rp2 integration test
        run: |
          export PYTHONPATH=${{ github.workspace }}/rp2/src:${{ github.workspace }}/dali-rp2/src:$PYTHONPATH
          cd ${{ github.workspace }}/rp2
          pytest tests/e2e/test_dali_rp2_e2e.py -v --tb=short